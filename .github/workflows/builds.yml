name: CMake Builds

on: [push, pull_request]

env:
  LIBNAME: godot_llama

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-macos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: windows-release
            os: windows-latest
            name: 🏁 Windows Release
            target: template_release
            platform: windows
            arch: x86_64
          - identifier: macos-release
            os: macos-latest
            name: 🍎 macOS Release
            target: template_release
            platform: macos
            arch: arm64
            enable_metal: ON
          - identifier: linux-release
            os: ubuntu-latest
            name: 🐧 Linux Release
            runner: ubuntu-20.04
            target: template_release
            platform: linux
            arch: x86_64

    env:
      GODOTCPP_TARGET: ${{ matrix.target }}
      GODOTCPP_PLATFORM: ${{ matrix.platform }}
      GODOTCPP_ARCH: ${{ matrix.arch }}
      ENABLE_METAL: ${{ matrix.enable_metal || 'OFF' }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install ninja
          elif [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -qqq ninja-build build-essential pkg-config
          elif [ "$RUNNER_OS" == "Windows" ]; then
            pip install ninja
          fi

      - name: Configure CMake
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_METAL=${{ env.ENABLE_METAL }}

      - name: Build project
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Install project
        shell: bash
        run: |
          cmake --install build --prefix=./install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.identifier }}
          path: |
            ./install/**

      - name: Archive Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ env.LIBNAME }}-cmake.${{ matrix.platform }}.${{ matrix.arch }}.zip'
          path: './install/'

      - name: Create and upload asset
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "${{ env.LIBNAME }}-cmake.${{ matrix.platform }}.${{ matrix.arch }}.zip"
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
